name: Main Branch Pipeline

on:
  push:
    branches:
      - main

jobs:
  # Job 1: Build and Test
  build-test:
    name: Build & Test
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      node_version: '20'
      run_tests: true

  # Job 2: Docker Build & Push — 'latest' tag (depends on Job 1)
  docker-build-latest:
    name: Docker Build & Push (latest)
    needs: build-test
    uses: ./.github/workflows/reusable-docker.yml
    with:
      image_name: github-actions-capstone
      tag: latest
    secrets:
      docker_username: ${{ secrets.DOCKER_USERNAME }}
      docker_token: ${{ secrets.DOCKER_TOKEN }}

  # Job 2b: Docker Build & Push — SHA tag (depends on Job 1)
  docker-build-sha:
    name: Docker Build & Push (SHA tag)
    needs: build-test
    runs-on: ubuntu-latest
    outputs:
      image_url: ${{ steps.push.outputs.image_url }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compute Short SHA
        id: sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Docker Image (SHA tag)
        id: push
        run: |
          IMAGE_URL="${{ secrets.DOCKER_USERNAME }}/github-actions-capstone:sha-${{ steps.sha.outputs.short_sha }}"
          docker build -t "$IMAGE_URL" .
          docker push "$IMAGE_URL"
          echo "image_url=$IMAGE_URL" >> $GITHUB_OUTPUT
          echo "Pushed: $IMAGE_URL"

  # Job 3: Deploy (depends on both Docker jobs)
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build-latest, docker-build-sha]
    environment: production

    steps:
      - name: Deploy
        run: |
          echo "=========================================="
          echo "🚀 Deploying image to production..."
          echo "   Image (latest) : ${{ needs.docker-build-latest.outputs.image_url }}"
          echo "   Image (SHA)    : ${{ needs.docker-build-sha.outputs.image_url }}"
          echo "   Commit SHA     : ${{ github.sha }}"
          echo "=========================================="
          echo "✅ Deployment complete."
