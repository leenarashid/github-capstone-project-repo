name: Main Branch Pipeline

on:
  push:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Build and Test
  # ─────────────────────────────────────────────
  build-test:
    name: Build & Test
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      node_version: '20'
      run_tests: true

  # ─────────────────────────────────────────────
  # Job 2: Generate Short SHA
  # Computes a 7-character commit SHA and exposes
  # it as an output for downstream jobs.
  # ─────────────────────────────────────────────
  generate-short-sha:
    name: Generate Short SHA
    runs-on: ubuntu-latest
    needs: build-test
    outputs:
      short_sha: ${{ steps.sha.outputs.short_sha }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compute Short SHA
        id: sha
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "✅ Short SHA: $SHORT_SHA"

  # ─────────────────────────────────────────────
  # Job 3a: Docker Build & Push — 'latest' tag
  # ─────────────────────────────────────────────
  docker-build-latest:
    name: Docker Build & Push (latest)
    needs: generate-short-sha
    uses: ./.github/workflows/reusable-docker.yml
    with:
      image_name: github-actions-capstone
      tag: latest
    secrets:
      docker_username: ${{ secrets.DOCKER_USERNAME }}
      docker_token: ${{ secrets.DOCKER_TOKEN }}

  # ─────────────────────────────────────────────
  # Job 3b: Docker Build & Push — SHA tag
  # Uses the short SHA produced by Job 2.
  # ─────────────────────────────────────────────
  docker-build:
    name: Docker Build & Push (SHA tag)
    needs: generate-short-sha
    runs-on: ubuntu-latest
    outputs:
      image_url: ${{ steps.push.outputs.image_url }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Docker Image (SHA tag)
        id: push
        run: |
          SHORT_SHA="${{ needs.generate-short-sha.outputs.short_sha }}"
          IMAGE_URL="${{ secrets.DOCKER_USERNAME }}/github-actions-capstone:sha-${SHORT_SHA}"
          docker build -t "$IMAGE_URL" .
          docker push "$IMAGE_URL"
          echo "image_url=$IMAGE_URL" >> $GITHUB_OUTPUT
          echo "🐳 Pushed: $IMAGE_URL"

  # ─────────────────────────────────────────────
  # Job 4: Deploy (depends on both Docker jobs)
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build-latest, docker-build]
    environment: production

    steps:
      - name: Deploy
        run: |
          echo "=========================================="
          echo "🚀 Deploying image to production..."
          echo "   Image (latest) : ${{ needs.docker-build-latest.outputs.image_url }}"
          echo "   Image (SHA)    : ${{ needs.docker-build.outputs.image_url }}"
          echo "   Short SHA      : ${{ needs.generate-short-sha.outputs.short_sha }}"
          echo "   Full Commit SHA: ${{ github.sha }}"
          echo "=========================================="
          echo "✅ Deployment complete."

